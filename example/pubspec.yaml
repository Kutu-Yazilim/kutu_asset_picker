name: kutu_asset_picker_example
description: Four real configurations of kutu_asset_picker — post, story, avatar and banner.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  kutu_asset_picker:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only the smoke test needs this, for FakeMediaTransform. The example app
  # itself never imports it — the picker pulls the plugin in transitively.
  # Hosted, not a path: this file ships inside the published archive, where
  # ../../kutu_media_transform does not exist.
  kutu_media_transform: ^0.2.0
  riverpod_annotation: ^4.0.7

flutter:
  uses-material-design: true

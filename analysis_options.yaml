include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true

plugins:
  riverpod_lint: 3.1.9

linter:
  rules:
    # Documentation coverage is scored on pub.dev. This lint names every gap with a
    # file and a line, and it is info-level, so it never costs static-analysis points.
    public_member_api_docs: true

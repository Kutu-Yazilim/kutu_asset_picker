name: kutu_asset_picker
description: "A themeable Flutter gallery picker with device-side crop for photos and video: per-asset aspect ratios, trim, cover frames, and a designed limited-access state."
version: 0.1.0
homepage: https://github.com/Kutu-Yazilim/kutu_asset_picker
repository: https://github.com/Kutu-Yazilim/kutu_asset_picker
issue_tracker: https://github.com/Kutu-Yazilim/kutu_asset_picker/issues
topics:
  - picker
  - gallery
  - crop
  - image-picker
  - video

screenshots:
  - description: The gallery grid with numbered selection badges and the camera tile.
    path: doc/picker-grid.png
  - description: The photo crop step, with the rest of the photo dimmed beyond the window and the ratio chips below.
    path: doc/crop-photo.png
  - description: The video crop step, with the trim range, playhead and cover controls under the window.
    path: doc/crop-video-trim.png
  - description: The limited-access state, with its permanent Manage selection bar.
    path: doc/limited-access.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # The floor must never drop below 3.8.1: earlier versions fail SQL pagination
  # with "Failed to obtain the cursor" (design §4.1). 3.11.0 also uses a private
  # PHAsset.filename selector that App Review has flagged — re-read the
  # changelog before every release (design §13).
  path: ^1.9.1
  photo_manager: ^3.12.0

  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  video_player: ^2.14.0

  kutu_media_transform: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  yaml: ^3.1.4

# There is deliberately NO `flutter:` section with a plugin block here, and
# deliberately no android/, ios/ or macos/ directory. pana reads platform
# support from a package's OWN pubspec, non-transitively, so this package keeps
# a clean 20/20 platform declaration while still depending on two plugins
# (design §2.2). test/package_shape_test.dart enforces it.
